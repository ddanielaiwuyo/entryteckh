# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name entrytech.co.uk www.entrytech.co.uk;

    # Let certbot prove domain ownership
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name entrytech.co.uk www.entrytech.co.uk;

    ssl_certificate     /etc/letsencrypt/live/entrytech.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/entrytech.co.uk/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Proxy all traffic to the Express app
    location / {
        proxy_pass         http://app:6989;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
