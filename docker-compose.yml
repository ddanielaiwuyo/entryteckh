services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - MONGO_URI=mongodb://mongo:27017/daniel_michael
    depends_on:
      - mongo
    networks:
      - internal

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - internal

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "
        certbot certonly --webroot --webroot-path=/var/www/certbot
        --email entryteckh@gmail.com
        --agree-tos --no-eff-email --keep-until-expiring
        -d entryteckh.co.uk -d www.entryteckh.co.uk
      "

volumes:
  mongo_data:
  certbot_certs:
  certbot_www:

networks:
  internal:
